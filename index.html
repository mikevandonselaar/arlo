<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to have non-zero values on notched iOS devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>utan</title>
    <meta name="description" content="Winkelen zonder gedoe. Scan in de winkel, utan brengt het thuis." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/favicon.png">

    <!-- Open Graph / social link previews -->
    <meta property="og:image" content="https://arlo-shopping.vercel.app/og-image.png">
    <meta name="twitter:image" content="https://arlo-shopping.vercel.app/og-image.png">
    <meta property="og:site_name" content="utan">
    <meta property="og:title" content="utan">
    <meta property="og:description" content="Winkelen zonder gedoe.">

    <!-- PWA: theme + install -->
    <meta name="theme-color" content="#F7F6F2" />
    <link rel="manifest" href="./public/manifest.json" />

    <!-- Typography: Familjen Grotesk + DM Mono are self-hosted via @fontsource (see main.tsx) -->

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="utan" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
